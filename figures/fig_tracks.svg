<text x="60" y="62" font-family="Lato" font-size="34" fill="#123A5C" font-weight="700" text-anchor="start">Five tracks, one backbone</text><text x="60" y="96" font-family="Lato" font-size="17" fill="#555555" text-anchor="start">Delivery overlaps by design; the gates, not the birthdays, decide readiness.</text><line x1="60" y1="118" x2="1140" y2="118" stroke="#C9A227" stroke-width="3"/><line x1="110" y1="520" x2="1130" y2="520" stroke="#8A9AA8" stroke-width="2"/><line x1="110" y1="514" x2="110" y2="526" stroke="#8A9AA8" stroke-width="2"/><text x="110" y="548" font-family="Lato" font-size="14" fill="#555555" text-anchor="middle">4</text><line x1="340" y1="514" x2="340" y2="526" stroke="#8A9AA8" stroke-width="2"/><text x="340" y="548" font-family="Lato" font-size="14" fill="#555555" text-anchor="middle">8</text><line x1="570" y1="514" x2="570" y2="526" stroke="#8A9AA8" stroke-width="2"/><text x="570" y="548" font-family="Lato" font-size="14" fill="#555555" text-anchor="middle">12</text><line x1="800" y1="514" x2="800" y2="526" stroke="#8A9AA8" stroke-width="2"/><text x="800" y="548" font-family="Lato" font-size="14" fill="#555555" text-anchor="middle">16</text><line x1="1030" y1="514" x2="1030" y2="526" stroke="#8A9AA8" stroke-width="2"/><text x="1030" y="548" font-family="Lato" font-size="14" fill="#555555" text-anchor="middle">20</text><line x1="1110" y1="514" x2="1110" y2="526" stroke="#8A9AA8" stroke-width="2"/><text x="1110" y="548" font-family="Lato" font-size="14" fill="#555555" text-anchor="middle">adult</text><rect x="140" y="150" width="290" height="42" rx="21" fill="#DCE6F1" stroke="#E2D3A8" stroke-width="2"/><text x="154" y="177" font-family="Lato" font-size="18" fill="#123A5C" font-weight="700" text-anchor="start">T1 Elementary</text><text x="140" y="140" font-family="Lato" font-size="15" fill="#555555" text-anchor="start">5–11  ·  Stages 0–5  ·  L0–L2</text><rect x="320" y="220" width="270" height="42" rx="21" fill="#FBF7E9" stroke="#E2D3A8" stroke-width="2"/><text x="334" y="247" font-family="Lato" font-size="18" fill="#123A5C" font-weight="700" text-anchor="start">T2 Middle</text><text x="320" y="210" font-family="Lato" font-size="15" fill="#555555" text-anchor="start">10–13  ·  Stages 4–11  ·  L2–L4</text><rect x="620" y="290" width="250" height="42" rx="21" fill="#DCE6F1" stroke="#E2D3A8" stroke-width="2"/><text x="634" y="317" font-family="Lato" font-size="18" fill="#123A5C" font-weight="700" text-anchor="start">T3 High School</text><text x="620" y="280" font-family="Lato" font-size="15" fill="#555555" text-anchor="start">14–18  ·  Stages 8–12  ·  L4–L5</text><rect x="860" y="360" width="140" height="42" rx="21" fill="#FBF7E9" stroke="#E2D3A8" stroke-width="2"/><text x="874" y="387" font-family="Lato" font-size="18" fill="#123A5C" font-weight="700" text-anchor="start">T4 University</text><text x="860" y="350" font-family="Lato" font-size="15" fill="#555555" text-anchor="start">18–22  ·  Stages 13–14  ·  L5–L6</text><rect x="990" y="430" width="130" height="42" rx="21" fill="#DCE6F1" stroke="#E2D3A8" stroke-width="2"/><text x="1004" y="457" font-family="Lato" font-size="18" fill="#123A5C" font-weight="700" text-anchor="start">T5 Life</text><text x="990" y="420" font-family="Lato" font-size="15" fill="#555555" text-anchor="start">adult  ·  Stage 16  ·  LX</text><text x="110" y="585" font-family="Lato" font-size="15" fill="#555555" font-style="italic" text-anchor="start">A 13-year-old may be in T2 on one concept and T3 on another. That is a feature.</text>
