<rect x="0" y="0" width="1200" height="650" fill="#F7F4EC"/>
<text x="60" y="62" font-family="Lato" font-size="34" fill="#123A5C" font-weight="700" text-anchor="start">The four parts of every artefact</text><text x="60" y="96" font-family="Lato" font-size="17" fill="#555555" text-anchor="start">The first three are the program. The fourth is the lesson.</text><line x1="60" y1="118" x2="1140" y2="118" stroke="#C9A227" stroke-width="3"/><rect x="220" y="150" width="760" height="400" rx="24" fill="none" stroke="#1F5A7A" stroke-width="3" stroke-dasharray="10 7"/><text x="600" y="135" font-family="Lato" font-size="16" fill="#1F5A7A" font-weight="700" text-anchor="middle">THE EDGE — what is not on the wall</text><rect x="270" y="200" width="660" height="300" rx="20" fill="#DCE6F1" stroke="#1F5A7A" stroke-width="2" opacity="0.55"/><text x="600" y="230" font-family="Lato" font-size="13" fill="#1F5A7A" font-weight="700" text-anchor="middle">THE GLASS BOX</text><rect x="300" y="260" width="260" height="80" rx="12" fill="#FBF7E9" stroke="#E2D3A8" stroke-width="2"/><text x="430" y="292" font-family="Lato" font-size="19" fill="#123A5C" font-weight="700" text-anchor="middle">FACTS</text><text x="430" y="316" font-family="Lato" font-size="16" fill="#555555" text-anchor="middle">what is on the wall</text><rect x="640" y="260" width="260" height="80" rx="12" fill="#FBF7E9" stroke="#E2D3A8" stroke-width="2"/><text x="770" y="292" font-family="Lato" font-size="19" fill="#123A5C" font-weight="700" text-anchor="middle">RULES</text><text x="770" y="316" font-family="Lato" font-size="16" fill="#555555" text-anchor="middle">what follows</text><rect x="470" y="400" width="260" height="70" rx="12" fill="#FBF7E9" stroke="#E2D3A8" stroke-width="2"/><text x="600" y="428" font-family="Lato" font-size="19" fill="#123A5C" font-weight="700" text-anchor="middle">QUERY</text><text x="600" y="450" font-family="Lato" font-size="16" fill="#555555" text-anchor="middle">what we ask</text><line x1="560" y1="320" x2="535" y2="395" stroke="#123A5C" stroke-width="2" marker-end="url(#arrow)"/><line x1="640" y1="320" x2="665" y2="395" stroke="#123A5C" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="590" font-family="Lato" font-size="17" fill="#555555" text-anchor="middle">A program shown without its edge teaches the closed-world error as a feature.</text>
