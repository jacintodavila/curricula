<rect x="0" y="0" width="1200" height="700" fill="#F7F4EC"/>
<text x="60" y="62" font-family="Lato" font-size="34" fill="#123A5C" font-weight="700" text-anchor="start">Four chapters, one ladder</text><text x="60" y="96" font-family="Lato" font-size="17" fill="#555555" text-anchor="start">The same concepts, met at increasing resolution.</text><line x1="60" y1="118" x2="1140" y2="118" stroke="#C9A227" stroke-width="3"/><rect x="60" y="400" width="250" height="230" rx="16" fill="#DCE6F1" stroke="#E2D3A8" stroke-width="2"/><rect x="60" y="400" width="250" height="10" rx="0" fill="#C9A227"/><text x="82" y="447" font-family="Lato" font-size="32" fill="#C9A227" font-weight="700" text-anchor="start">1</text><text x="82" y="482" font-family="Lato" font-size="22" fill="#123A5C" font-weight="700" text-anchor="start">Foundations</text><text x="82" y="508" font-family="Lato" font-size="17" fill="#555555" text-anchor="start">4–8</text><text x="82" y="535" font-family="Lato" font-size="18" fill="#1F5A7A" font-style="italic" text-anchor="start">Is that the thing,</text><text x="82" y="557" font-family="Lato" font-size="18" fill="#1F5A7A" font-style="italic" text-anchor="start">or a name for it?</text><text x="82" y="575" font-family="Lato" font-size="10.5" fill="#555555" font-weight="700" text-anchor="start">THEY BUILD</text><text x="82" y="599" font-family="Lato" font-size="14.5" fill="#555555" text-anchor="start">a wall of five fact cards</text><rect x="335" y="340" width="250" height="290" rx="16" fill="#FBF7E9" stroke="#E2D3A8" stroke-width="2"/><rect x="335" y="340" width="250" height="10" rx="0" fill="#1F5A7A"/><text x="357" y="387" font-family="Lato" font-size="32" fill="#C9A227" font-weight="700" text-anchor="start">2</text><text x="357" y="422" font-family="Lato" font-size="22" fill="#123A5C" font-weight="700" text-anchor="start">Rules &amp; search</text><text x="357" y="448" font-family="Lato" font-size="17" fill="#555555" text-anchor="start">8–11</text><text x="357" y="475" font-family="Lato" font-size="18" fill="#1F5A7A" font-style="italic" text-anchor="start">Does it follow?</text><text x="357" y="497" font-family="Lato" font-size="18" fill="#1F5A7A" font-style="italic" text-anchor="start">Have we tried everything?</text><text x="357" y="575" font-family="Lato" font-size="10.5" fill="#555555" font-weight="700" text-anchor="start">THEY BUILD</text><text x="357" y="599" font-family="Lato" font-size="14.5" fill="#555555" text-anchor="start">a class rule base and a debug log</text><rect x="610" y="270" width="250" height="360" rx="16" fill="#DCE6F1" stroke="#E2D3A8" stroke-width="2"/><rect x="610" y="270" width="250" height="10" rx="0" fill="#C9A227"/><text x="632" y="317" font-family="Lato" font-size="32" fill="#C9A227" font-weight="700" text-anchor="start">3</text><text x="632" y="352" font-family="Lato" font-size="22" fill="#123A5C" font-weight="700" text-anchor="start">Critique</text><text x="632" y="378" font-family="Lato" font-size="17" fill="#555555" text-anchor="start">11–15</text><text x="632" y="405" font-family="Lato" font-size="18" fill="#1F5A7A" font-style="italic" text-anchor="start">What did they not say?</text><text x="632" y="575" font-family="Lato" font-size="10.5" fill="#555555" font-weight="700" text-anchor="start">THEY BUILD</text><text x="632" y="599" font-family="Lato" font-size="14.5" fill="#555555" text-anchor="start">a bad-argument rule base</text><rect x="885" y="190" width="260" height="440" rx="16" fill="#FBF7E9" stroke="#E2D3A8" stroke-width="2"/><rect x="885" y="190" width="260" height="10" rx="0" fill="#1F5A7A"/><text x="907" y="237" font-family="Lato" font-size="32" fill="#C9A227" font-weight="700" text-anchor="start">4</text><text x="907" y="272" font-family="Lato" font-size="22" fill="#123A5C" font-weight="700" text-anchor="start">Judgement</text><text x="907" y="298" font-family="Lato" font-size="17" fill="#555555" text-anchor="start">15–adult</text><text x="907" y="325" font-family="Lato" font-size="18" fill="#1F5A7A" font-style="italic" text-anchor="start">Where does the model end?</text><text x="907" y="575" font-family="Lato" font-size="10.5" fill="#555555" font-weight="700" text-anchor="start">THEY BUILD</text><text x="907" y="599" font-family="Lato" font-size="14.5" fill="#555555" text-anchor="start">a program with a boundary note</text><text x="60" y="675" font-family="Lato" font-size="15" fill="#555555" text-anchor="start">Chapters are conceptual; tracks are delivery. They overlap by design.</text>
</svg>