<rect x="0" y="0" width="1200" height="520" fill="#F7F4EC"/>
<text x="60" y="62" font-family="Lato" font-size="34" fill="#123A5C" font-weight="700" text-anchor="start">A search tree you can see</text><text x="60" y="96" font-family="Lato" font-size="17" fill="#555555" text-anchor="start">Depth-first search, a choice point, and a backtrack.</text><line x1="60" y1="118" x2="1140" y2="118" stroke="#C9A227" stroke-width="3"/><rect x="430" y="150" width="340" height="60" rx="10" fill="#DCE6F1" stroke="#1F5A7A" stroke-width="2"/><text x="600" y="185" font-family="DejaVu Sans Mono" font-size="14" fill="#123A5C" text-anchor="middle">?- ancestor(ana, X).</text><line x1="600" y1="210" x2="480" y2="270" stroke="#123A5C" stroke-width="2" marker-end="url(#arrow)"/><line x1="600" y1="210" x2="720" y2="270" stroke="#123A5C" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="270" width="280" height="60" rx="10" fill="#FBF7E9" stroke="#E2D3A8" stroke-width="2"/><text x="480" y="305" font-family="DejaVu Sans Mono" font-size="13" fill="#123A5C" text-anchor="middle">parent(ana, X)</text><rect x="620" y="270" width="300" height="60" rx="10" fill="#FBF7E9" stroke="#E2D3A8" stroke-width="2"/><text x="770" y="305" font-family="DejaVu Sans Mono" font-size="12" fill="#123A5C" text-anchor="middle">parent(ana, Z), ancestor(Z, X)</text><line x1="480" y1="330" x2="480" y2="390" stroke="#123A5C" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="420" font-family="Lato" font-size="13" fill="#2E7D5B" font-weight="700" text-anchor="middle">X = bob  ✓</text><line x1="770" y1="330" x2="770" y2="390" stroke="#123A5C" stroke-width="2" marker-end="url(#arrow)"/><rect x="640" y="390" width="260" height="55" rx="8" fill="#F6DADA" stroke="#A23B3B" stroke-width="2"/><text x="770" y="422" font-family="Lato" font-size="12" fill="#A23B3B" font-weight="700" text-anchor="middle">fail: no clause</text><line x1="770" y1="445" x2="600" y2="445" stroke="#A23B3B" stroke-width="2" stroke-dasharray="6 4"/><line x1="600" y1="445" x2="600" y2="340" stroke="#A23B3B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="590" y="470" font-family="Lato" font-size="11" fill="#A23B3B" text-anchor="end">backtrack to the choice point</text>
