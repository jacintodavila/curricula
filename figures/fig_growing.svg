<text x="60" y="62" font-family="Lato" font-size="34" fill="#123A5C" font-weight="700" text-anchor="start">The Growing Rule Base</text><text x="60" y="96" font-family="Lato" font-size="17" fill="#555555" text-anchor="start">One artefact, revisited from age 5 to 18.</text><line x1="60" y1="118" x2="1140" y2="118" stroke="#C9A227" stroke-width="3"/><rect x="410" y="545" width="380" height="48" rx="8" fill="#DCE6F1" stroke="#E2D3A8" stroke-width="2"/><text x="424" y="575" font-family="Lato" font-size="17" fill="#C9A227" font-weight="700" text-anchor="start">5–7</text><text x="510" y="575" font-family="Lato" font-size="20" fill="#123A5C" text-anchor="start">five fact cards</text><rect x="380" y="487" width="440" height="48" rx="8" fill="#FBF7E9" stroke="#E2D3A8" stroke-width="2"/><text x="394" y="517" font-family="Lato" font-size="17" fill="#C9A227" font-weight="700" text-anchor="start">7–9</text><text x="480" y="517" font-family="Lato" font-size="20" fill="#123A5C" text-anchor="start">questions</text><rect x="350" y="429" width="500" height="48" rx="8" fill="#DCE6F1" stroke="#E2D3A8" stroke-width="2"/><text x="364" y="459" font-family="Lato" font-size="17" fill="#C9A227" font-weight="700" text-anchor="start">9–11</text><text x="450" y="459" font-family="Lato" font-size="20" fill="#123A5C" text-anchor="start">if–then rules</text><rect x="320" y="371" width="560" height="48" rx="8" fill="#FBF7E9" stroke="#E2D3A8" stroke-width="2"/><text x="334" y="401" font-family="Lato" font-size="17" fill="#C9A227" font-weight="700" text-anchor="start">11–13</text><text x="420" y="401" font-family="Lato" font-size="20" fill="#123A5C" text-anchor="start">search, negation, counterexamples</text><rect x="290" y="313" width="620" height="48" rx="8" fill="#DCE6F1" stroke="#E2D3A8" stroke-width="2"/><text x="304" y="343" font-family="Lato" font-size="17" fill="#C9A227" font-weight="700" text-anchor="start">13–15</text><text x="390" y="343" font-family="Lato" font-size="20" fill="#123A5C" text-anchor="start">Prolog and ghost rules</text><rect x="260" y="255" width="680" height="48" rx="8" fill="#FBF7E9" stroke="#E2D3A8" stroke-width="2"/><text x="274" y="285" font-family="Lato" font-size="17" fill="#C9A227" font-weight="700" text-anchor="start">15–16</text><text x="360" y="285" font-family="Lato" font-size="20" fill="#123A5C" text-anchor="start">defaults and limits</text><rect x="230" y="197" width="740" height="48" rx="8" fill="#DCE6F1" stroke="#E2D3A8" stroke-width="2"/><text x="244" y="227" font-family="Lato" font-size="17" fill="#C9A227" font-weight="700" text-anchor="start">16–18</text><text x="330" y="227" font-family="Lato" font-size="20" fill="#123A5C" text-anchor="start">audit and public defence</text><text x="600" y="625" font-family="Lato" font-size="15" fill="#555555" text-anchor="middle">It is never thrown away; it is re-represented.</text>
</svg>