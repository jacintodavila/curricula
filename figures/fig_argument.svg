<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#123A5C"/></marker>
<marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#C9A227"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="530" fill="#F7F4EC"/>
<text x="60" y="62" font-family="Lato" font-size="34" fill="#123A5C" font-weight="700" text-anchor="start">The anatomy of an argument</text><text x="60" y="96" font-family="Lato" font-size="17" fill="#555555" text-anchor="start">The warrant is the ghost rule: the premise you were not given.</text><line x1="60" y1="118" x2="1140" y2="118" stroke="#C9A227" stroke-width="3"/><rect x="80" y="220" width="270" height="100" rx="10" fill="#FBF7E9" stroke="#E2D3A8" stroke-width="2"/><text x="215" y="255" font-family="Lato" font-size="15" fill="#123A5C" font-weight="700" text-anchor="middle">GROUNDS</text><text x="215" y="280" font-family="Lato" font-size="11" fill="#555555" text-anchor="middle">what we have</text><rect x="465" y="220" width="270" height="100" rx="10" fill="#FBF7E9" stroke="#E2D3A8" stroke-width="2"/><text x="600" y="255" font-family="Lato" font-size="15" fill="#123A5C" font-weight="700" text-anchor="middle">WARRANT</text><text x="600" y="280" font-family="Lato" font-size="11" fill="#555555" text-anchor="middle">why the grounds support it</text><rect x="850" y="220" width="270" height="100" rx="10" fill="#FBF7E9" stroke="#E2D3A8" stroke-width="2"/><text x="985" y="255" font-family="Lato" font-size="15" fill="#123A5C" font-weight="700" text-anchor="middle">CLAIM</text><text x="985" y="280" font-family="Lato" font-size="11" fill="#555555" text-anchor="middle">what we want to establish</text><line x1="350" y1="270" x2="465" y2="270" stroke="#123A5C" stroke-width="2" marker-end="url(#arrow)"/><line x1="735" y1="270" x2="850" y2="270" stroke="#123A5C" stroke-width="2" marker-end="url(#arrow)"/><rect x="465" y="380" width="270" height="70" rx="10" fill="#F3E6B8" stroke="#E2D3A8" stroke-width="2"/><text x="600" y="410" font-family="Lato" font-size="13" fill="#123A5C" font-weight="700" text-anchor="middle">REBUTTAL</text><text x="600" y="432" font-family="Lato" font-size="10" fill="#555555" text-anchor="middle">unless something blocks the warrant</text><line x1="600" y1="320" x2="600" y2="380" stroke="#1F5A7A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="985" y="190" font-family="Lato" font-size="11" fill="#C9A227" font-weight="700" text-anchor="middle">QUALIFIER: probably · on the whole</text><text x="600" y="500" font-family="Lato" font-size="12" fill="#555555" text-anchor="middle">Write down the warrant. Then ask whether it is true, or merely familiar.</text>
</svg>