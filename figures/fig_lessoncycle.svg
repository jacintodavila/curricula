<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#123A5C"/></marker>
<marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#C9A227"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="640" fill="#F7F4EC"/>
<text x="60" y="62" font-family="Lato" font-size="34" fill="#123A5C" font-weight="700" text-anchor="start">The five-move lesson cycle</text><text x="60" y="96" font-family="Lato" font-size="17" fill="#555555" text-anchor="start">Every module uses it; every teacher is trained on it.</text><line x1="60" y1="118" x2="1140" y2="118" stroke="#C9A227" stroke-width="3"/><circle cx="600" cy="160" r="54" fill="#DCE6F1" stroke="#1F5A7A" stroke-width="3"/><text x="600" y="166" font-family="Lato" font-size="19" fill="#123A5C" font-weight="700" text-anchor="middle">See it</text><circle cx="723.5" cy="249.7" r="54" fill="#DCE6F1" stroke="#1F5A7A" stroke-width="3"/><text x="723.5" y="255.7" font-family="Lato" font-size="19" fill="#123A5C" font-weight="700" text-anchor="middle">Say it</text><circle cx="676.7" cy="395.3" r="54" fill="#DCE6F1" stroke="#1F5A7A" stroke-width="3"/><text x="676.7" y="401.3" font-family="Lato" font-size="19" fill="#123A5C" font-weight="700" text-anchor="middle">Play it</text><circle cx="523.3" cy="395.3" r="54" fill="#DCE6F1" stroke="#1F5A7A" stroke-width="3"/><text x="523.3" y="401.3" font-family="Lato" font-size="19" fill="#123A5C" font-weight="700" text-anchor="middle">Prove it</text><circle cx="476.5" cy="249.7" r="54" fill="#DCE6F1" stroke="#1F5A7A" stroke-width="3"/><text x="476.5" y="255.7" font-family="Lato" font-size="19" fill="#123A5C" font-weight="700" text-anchor="middle">Break it</text><line x1="646.928044965918" y1="194.08458002787734" x2="676.571955034082" y2="215.61541997212265" stroke="#C9A227" stroke-width="3" marker-end="url(#arrowg)"/><line x1="705.7514675360391" y1="304.9176565545453" x2="694.448532463961" y2="340.0823434454547" stroke="#C9A227" stroke-width="3" marker-end="url(#arrowg)"/><line x1="618.7" y1="395.3" x2="581.3" y2="395.3" stroke="#C9A227" stroke-width="3" marker-end="url(#arrowg)"/><line x1="505.55146753603896" y1="340.0823434454547" x2="494.248532463961" y2="304.9176565545453" stroke="#C9A227" stroke-width="3" marker-end="url(#arrowg)"/><line x1="523.428044965918" y1="215.61541997212265" x2="553.071955034082" y2="194.08458002787734" stroke="#C9A227" stroke-width="3" marker-end="url(#arrowg)"/><text x="55" y="540" font-family="Lato" font-size="17" fill="#123A5C" font-weight="700" text-anchor="start">See it</text><text x="55" y="560" font-family="Lato" font-size="14" fill="#555555" text-anchor="start">a case in the body</text><text x="285" y="540" font-family="Lato" font-size="17" fill="#123A5C" font-weight="700" text-anchor="start">Say it</text><text x="285" y="560" font-family="Lato" font-size="14" fill="#555555" text-anchor="start">the learner’s words</text><text x="515" y="540" font-family="Lato" font-size="17" fill="#123A5C" font-weight="700" text-anchor="start">Play it</text><text x="515" y="560" font-family="Lato" font-size="14" fill="#555555" text-anchor="start">used in a game</text><text x="745" y="540" font-family="Lato" font-size="17" fill="#123A5C" font-weight="700" text-anchor="start">Prove it</text><text x="745" y="560" font-family="Lato" font-size="14" fill="#555555" text-anchor="start">show the chain</text><text x="975" y="540" font-family="Lato" font-size="17" fill="#123A5C" font-weight="700" text-anchor="start">Break it</text><text x="975" y="560" font-family="Lato" font-size="14" fill="#555555" text-anchor="start">find the failure</text><text x="600" y="610" font-family="Lato" font-size="14.5" fill="#555555" text-anchor="middle">A curriculum that stops at “Prove it” produces confident reasoners; only “Break it” produces critical ones.</text>
</svg>